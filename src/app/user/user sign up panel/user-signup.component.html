<h1>ثبت نام</h1>
<div class="card">

    <div class="p-inputgroup">
        <span class="p-inputgroup-addon">
            <i class="pi pi-user-edit"></i>
        </span>
        <input type="text" pInputText placeholder="نام " />
    </div>

    <div class="p-inputgroup">
        <span class="p-inputgroup-addon">
            <i class="pi pi-user-edit"></i>
        </span>
        <input type="text" pInputText placeholder="نام خانوادگی" />
    </div>


    <div class="p-inputgroup">
        <span class="p-inputgroup-addon">
            <i class="pi pi-user"></i>
        </span>
        <input type="text" pInputText placeholder="نام کاربری" />
    </div>

    <div class="p-inputgroup">
        <span class="p-inputgroup-addon">
            <i class="pi pi-mobile"></i>
        </span>
        <input type="text" pInputText placeholder="شماره تلفن همراه" />
    </div>

    <div class="p-inputgroup">
        <span class="p-inputgroup-addon">
            <i class="pi pi-lock"></i>
        </span>
        <input type="password" pInputText placeholder="رمز عبور" />
    </div>


    <div class="p-inputgroup">
        <span class="p-inputgroup-addon">
            <i class="pi pi-check-circle"></i>
        </span>
        <input type="password" pInputText placeholder="تکرار رمز عبور" />
    </div>

    <div class="p-inputgroup">
        <span class="p-inputgroup-addon">
            <i class="pi pi-envelope"></i>
        </span>
        <input type="email" pInputText placeholder="ایمیل (اختیاری)" />
        <!-- <span class="p-inputgroup-addon">
                <i class="pi pi-info-circle" style="color: #6c757d;" pTooltip="اختیاری" tooltipPosition="top"></i>
            </span> -->
    </div>

    <div class="Submit-button">
        <p-button label="ثبت‌نام" />
    </div>
</div>
