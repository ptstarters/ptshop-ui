<footer class="site-footer">
  <nav
    class="footer-navigation"
    aria-label="منوی پایین صفحه"
  >
    <button
      *ngFor="
        let item of footerItems;
        trackBy: trackByItemId
      "
      type="button"
      class="footer-item"
      [class.footer-item-active]="isItemActive(item)"
      [routerLink]="item.routerLink"
      (click)="selectItem(item.id)"
    >
      <i
        class="footer-icon"
        [class]="item.icon"
      ></i>

      <span class="footer-title">
        {{ item.title }}
      </span>
    </button>
  </nav>
</footer>
