<div class="discount-page" dir="rtl">
  <main class="discount-container">
    <!-- نوار بالای صفحه -->
    <header class="discount-toolbar">
      <button
        type="button"
        class="toolbar-button back-button"
        aria-label="بازگشت به صفحه قبلی"
        (click)="goBack()"
      >
        <i class="pi pi-arrow-right"></i>
      </button>

      <button type="button" class="address-button" (click)="selectAddress()">
        <i class="pi pi-map-marker"></i>

        <span>انتخاب آدرس</span>

        <i class="pi pi-angle-down"></i>
      </button>

      <button
        type="button"
        class="toolbar-button cart-button"
        aria-label="مشاهده سبد خرید"
        (click)="openCart()"
      >
        <i class="pi pi-shopping-cart"></i>
      </button>
    </header>

    <!-- بنر تخفیف داغ -->
    <section class="discount-banner">
      <div class="banner-content">
        <span class="banner-fire" aria-hidden="true"> 🔥 </span>

        <div class="banner-text">
          <h1>تخفیف داغ</h1>

          <p>
            همه
            <strong>فودپروها</strong>
            رو یکجا ببین!
          </p>
        </div>
      </div>

      <!-- فیلترها -->
      <div class="discount-filters">
        <button
          *ngFor="let filter of discountFilters; trackBy: trackByFilterId"
          type="button"
          class="filter-button"
          [class.filter-button-active]="activeFilter === filter.id"
          [attr.aria-pressed]="activeFilter === filter.id"
          (click)="selectFilter(filter.id)"
        >
          <span class="filter-icon">
            {{ filter.icon }}
          </span>

          <span>
            {{ filter.title }}
          </span>
        </button>
      </div>
    </section>

    <!-- حالت خالی -->
    <section class="empty-discount-state">
      <div class="empty-bag" aria-hidden="true">
        <span class="bag-handle"></span>
        <span class="bag-body">
          <span class="bag-eye"></span>
          <span class="bag-eye"></span>
        </span>
      </div>

      <h2>پیشنهادهای جدید به‌زودی فعال می‌شوند</h2>

      <p>تخفیف‌های جدید پارس فود در همین صفحه نمایش داده خواهند شد.</p>
    </section>
  </main>

  <app-footer></app-footer>
</div>
