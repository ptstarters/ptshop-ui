<div class="empty-cart-page" dir="rtl">
  <header class="top-header">
    <button pButton type="button" class="back-button p-button-text" aria-label="بازگشت به صفحه اصلی" (click)="goBack()">
      <i class="pi pi-arrow-right"></i>
    </button>

    <button type="button" class="address-button" (click)="selectAddress()">
      <span>انتخاب آدرس</span>
      <span class="address-arrow">⌄</span>
    </button>
  </header>

  <main class="empty-cart-content">
    <div class="bag-illustration">
      <div class="bag-handle"></div>

      <div class="bag-body">
        <div class="bag-face">
          <span class="eye"></span>
          <span class="eye"></span>
        </div>
      </div>
    </div>

    <h1>سبد خرید شما خالی است</h1>

    <p>در حال حاضر سبد خرید فعالی ندارید.</p>

    <button type="button" class="start-order-button" (click)="startOrder()">
      شروع ثبت سفارش
    </button>
  </main>
</div>
